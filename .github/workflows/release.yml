name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build control-server
        run: |
          cd control-server
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller control-server.spec
          mkdir -p ../desktop/src-tauri/binaries
          cp dist/control-server.exe ../desktop/src-tauri/binaries/control-server-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Build local-engine
        run: |
          cd local-engine
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller local-engine.spec
          cp dist/local-engine.exe ../desktop/src-tauri/binaries/local-engine-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Windows
        run: |
          cd desktop
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload to Cloudflare R2
        shell: bash
        run: |
          # Install rclone
          curl https://rclone.org/install.sh | sudo bash
          
          # Configure rclone for R2
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = public-read
          EOF
          
          # Upload MSI to R2
          MSI_FILE=$(ls desktop/src-tauri/target/release/bundle/msi/*.msi | head -1)
          MSI_FILENAME=$(basename "$MSI_FILE")
          
          rclone copy "$MSI_FILE" r2:${{ secrets.R2_BUCKET_NAME }}/windows/v${{ steps.version.outputs.VERSION }}/ --progress
          
          echo "✅ Uploaded to R2: $MSI_FILENAME"
          echo "📦 Public URL: ${{ secrets.R2_PUBLIC_URL }}/windows/v${{ steps.version.outputs.VERSION }}/$MSI_FILENAME"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig
          tag_name: v${{ steps.version.outputs.VERSION }}-windows
          name: Windows v${{ steps.version.outputs.VERSION }}
          body: |
            - Ollama 자동 설치
            - AI 모델 자동 다운로드
            - 자동 업데이트 지원
            
            **다운로드:**
            - Cloudflare R2: ${{ secrets.R2_PUBLIC_URL }}/windows/v${{ steps.version.outputs.VERSION }}/Insurance.AI_2.2.0_x64_en-US.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-metadata:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updates repo
        uses: actions/checkout@v4
        with:
          repository: nasawon0-beep/insurance-ai-updates
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update windows.json
        run: |
          cat > api/windows.json <<EOF
          {
            "platform": "windows",
            "name": "Windows",
            "status": "available",
            "latestVersion": "v${{ steps.version.outputs.VERSION }}",
            "releaseDate": "$(date +%Y-%m-%d)",
            "downloadUrl": "${{ secrets.R2_PUBLIC_URL }}/windows/v${{ steps.version.outputs.VERSION }}/Insurance.AI_2.2.0_x64_en-US.msi",
            "fileName": "Insurance.AI_2.2.0_x64_en-US.msi",
            "changelog": [
              "Ollama 자동 설치",
              "AI 모델 자동 다운로드 (bge-m3, qwen2.5)",
              "자동 업데이트 지원"
            ]
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add api/*.json
          git commit -m "Auto-update to v${{ steps.version.outputs.VERSION }}"
          git push
