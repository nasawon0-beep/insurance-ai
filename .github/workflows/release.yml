name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 2.2.8)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-windows')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            echo "Use plain semver like 2.2.8. Do not use v2.2.8-windows as a trigger tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved VERSION=$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build control-server
        run: |
          cd control-server
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller control-server.spec
          mkdir -p ../desktop/src-tauri/binaries
          cp dist/control-server.exe ../desktop/src-tauri/binaries/control-server-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Build local-engine onedir runtime
        shell: pwsh
        run: |
          python -m venv local-engine/.venv
          & local-engine/.venv/Scripts/python.exe -m pip install --upgrade pip
          & local-engine/.venv/Scripts/python.exe -m pip install -r local-engine/requirements.txt -r tests/requirements.txt 'pyinstaller>=6,<7'
          & scripts/build-local-engine-onedir.ps1

      - name: Verify local-engine onedir modules and resources
        shell: pwsh
        run: |
          $Exe = (Get-ChildItem desktop/src-tauri/binaries/onedir/local-engine-*.exe -File | Select-Object -First 1).FullName
          $Internal = 'desktop/src-tauri/binaries/onedir/local-engine._internal'
          if (-not $Exe -or -not (Test-Path "$Internal/python311.dll")) {
            throw 'local-engine onedir executable/runtime is incomplete'
          }
          & local-engine/.venv/Scripts/python.exe -m PyInstaller.utils.cliutils.archive_viewer -l -r -b $Exe > local-engine-archive.txt
          foreach ($Module in @('runtime_paths', 'database.coverage', 'database.coverage_analysis_parser', 'database.coverage_mapping')) {
            if (-not (Select-String -LiteralPath local-engine-archive.txt -SimpleMatch $Module -Quiet)) {
              throw "required local-engine module missing: $Module"
            }
          }
          if (Test-Path "$Internal/whisper/models") {
            $RuntimeCache = Get-ChildItem "$Internal/whisper/models" -Recurse -File
            if ($RuntimeCache) { throw 'runtime Whisper cache must not be packaged' }
          }
          if (Test-Path "$Internal/logs") {
            $RuntimeLogs = Get-ChildItem "$Internal/logs" -Recurse -File
            if ($RuntimeLogs) { throw 'runtime logs must not be packaged' }
          }

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Verify app version
        shell: bash
        run: |
          node scripts/check-version-sync.mjs
          test "$(node -p "require('./desktop/package.json').version")" = "${{ steps.version.outputs.VERSION }}"

      - name: Validate release candidate
        shell: bash
        run: |
          python -m pytest -q tests/test_policy_coverages.py tests/test_main_coverage_recalculate_api.py tests/test_coverage_analysis_api.py tests/test_coverage_analysis_parser.py tests/test_coverage_mapping.py
          npm test
          cd desktop
          node --test --experimental-strip-types tests/*.test.ts tests/*.test.mjs
          npm run build
          cd src-tauri
          cargo check

      - name: Build Windows signed bundles from onedir candidate
        run: |
          cd desktop
          npm run tauri -- build --ci -v --config src-tauri/tauri.onedir.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse | Select-Object FullName, Length

      - name: Upload private validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-v${{ steps.version.outputs.VERSION }}-candidate
          path: |
            desktop/src-tauri/target/release/bundle/msi/*
            desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}-windows"
          TITLE="Windows v${{ steps.version.outputs.VERSION }}"
          BODY_FILE="release-body.md"

          cat > "$BODY_FILE" <<'EOF'
          Windows signed build v${{ steps.version.outputs.VERSION }}

          변경사항:
          - 실행파일명 Insurance AI.exe 적용
          - updater endpoint GitHub Pages 사용
          - Tauri updater 서명 산출물 포함
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file "$BODY_FILE"
          else
            gh release create "$TAG" --draft --title "$TITLE" --notes-file "$BODY_FILE" --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" \
            desktop/src-tauri/target/release/bundle/msi/* \
            desktop/src-tauri/target/release/bundle/nsis/* \
            --clobber
