name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 2.2.8)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-windows')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            echo "Use plain semver like 2.2.8. Do not use v2.2.8-windows as a trigger tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved VERSION=$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build control-server
        run: |
          cd control-server
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller control-server.spec
          mkdir -p ../desktop/src-tauri/binaries
          cp dist/control-server.exe ../desktop/src-tauri/binaries/control-server-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Build local-engine
        run: |
          cd local-engine
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller local-engine.spec
          cp dist/local-engine.exe ../desktop/src-tauri/binaries/local-engine-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Verify app version
        shell: bash
        run: |
          node -e "const p=require('./desktop/package.json'); if (p.version !== '${{ steps.version.outputs.VERSION }}') { console.error('desktop/package.json version mismatch', p.version); process.exit(1); }"
          node -e "const c=require('./desktop/src-tauri/tauri.conf.json'); if (c.version !== '${{ steps.version.outputs.VERSION }}') { console.error('tauri.conf.json version mismatch', c.version); process.exit(1); }"

      - name: Build Windows signed bundles
        run: |
          cd desktop
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem desktop\src-tauri\target\release\bundle -Recurse | Select-Object FullName, Length

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-windows
          name: Windows v${{ steps.version.outputs.VERSION }}
          body: |
            Windows signed build v${{ steps.version.outputs.VERSION }}

            변경사항:
            - 실행파일명 Insurance AI.exe 적용
            - updater endpoint GitHub Pages 사용
            - Tauri updater 서명 산출물 포함
          overwrite_files: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/*
            desktop/src-tauri/target/release/bundle/nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
