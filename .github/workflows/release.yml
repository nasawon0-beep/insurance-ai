name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 2.2.8)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-windows')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            echo "Use plain semver like 2.2.8. Do not use v2.2.8-windows as a trigger tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved VERSION=$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build control-server
        run: |
          cd control-server
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller control-server.spec
          mkdir -p ../desktop/src-tauri/binaries
          cp dist/control-server.exe ../desktop/src-tauri/binaries/control-server-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Validate isolated control regressions
        shell: bash
        run: |
          python -m pip install -r tests/requirements.txt
          python scripts/run_release_regressions.py --group control --output "$RUNNER_TEMP/release-control"

      - name: Build local-engine onedir runtime
        shell: pwsh
        run: |
          python -m venv local-engine/.venv
          & local-engine/.venv/Scripts/python.exe -m pip install --upgrade pip
          & local-engine/.venv/Scripts/python.exe -m pip install -r local-engine/requirements.txt -r tests/requirements.txt 'pyinstaller>=6,<7'
          & scripts/build-local-engine-onedir.ps1

      - name: Build pinned maintenance workers
        shell: pwsh
        run: |
          $env:TMPDIR = $env:RUNNER_TEMP
          & local-engine/.venv/Scripts/python.exe scripts/build_maintenance_worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & local-engine/.venv/Scripts/python.exe scripts/build_maintenance_worker.py --qa-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & local-engine/.venv/Scripts/python.exe -m pytest -q tests/test_packaged_maintenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MAINTENANCE_TEST_PYTHON=$((Resolve-Path local-engine/.venv/Scripts/python.exe).Path)" >> $env:GITHUB_ENV
          'MAINTENANCE_TEST_PACKAGED_WORKER=C:/build/moadoom-maintenance-qa/qa-maintenance-worker.exe' >> $env:GITHUB_ENV

      - name: Verify local-engine onedir modules and resources
        shell: pwsh
        run: |
          $Exe = (Get-ChildItem desktop/src-tauri/binaries/onedir/local-engine-*.exe -File | Select-Object -First 1).FullName
          $Internal = 'desktop/src-tauri/binaries/onedir/local-engine._internal'
          if (-not $Exe -or -not (Test-Path "$Internal/python311.dll")) {
            throw 'local-engine onedir executable/runtime is incomplete'
          }
          & local-engine/.venv/Scripts/python.exe -m PyInstaller.utils.cliutils.archive_viewer -l -r -b $Exe > local-engine-archive.txt
          foreach ($Module in @('runtime_paths', 'account_boundary', 'authority_clock', 'protected_business_key', 'rag.store', 'database.backup', 'database.coverage', 'database.coverage_analysis_parser', 'database.coverage_mapping', 'database.family', 'database.business_reset', 'database.reset_router', 'database.reset_activity', 'lan_sync.store')) {
            if (-not (Select-String -LiteralPath local-engine-archive.txt -SimpleMatch $Module -Quiet)) {
              throw "required local-engine module missing: $Module"
            }
          }
          if (Test-Path "$Internal/whisper/models") {
            $RuntimeCache = Get-ChildItem "$Internal/whisper/models" -Recurse -File
            if ($RuntimeCache) { throw 'runtime Whisper cache must not be packaged' }
          }
          if (Test-Path "$Internal/logs") {
            $RuntimeLogs = Get-ChildItem "$Internal/logs" -Recurse -File
            if ($RuntimeLogs) { throw 'runtime logs must not be packaged' }
          }

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Verify app version
        shell: bash
        run: |
          node scripts/check-version-sync.mjs
          test "$(node -p "require('./desktop/package.json').version")" = "${{ steps.version.outputs.VERSION }}"

      - name: Load moadoom central public build config
        shell: bash
        env:
          VITE_MOADOOM_WORKSPACE_PUBLIC_KEYS: ${{ vars.VITE_MOADOOM_WORKSPACE_PUBLIC_KEYS }}
          VITE_MOADOOM_MAINTENANCE_PUBLIC_KEYS: ${{ vars.VITE_MOADOOM_MAINTENANCE_PUBLIC_KEYS }}
        run: node scripts/build-moadoom-live.mjs github-env

      - name: Validate release candidate
        shell: bash
        run: |
          local-engine/.venv/Scripts/python.exe scripts/run_release_regressions.py --group engine --output "$RUNNER_TEMP/release-engine"
          PYTHONPATH=tests local-engine/.venv/Scripts/python.exe -m pytest -p account_bound_ci -q tests/test_policy_coverages.py tests/test_main_coverage_recalculate_api.py tests/test_coverage_analysis_api.py tests/test_coverage_analysis_parser.py tests/test_coverage_mapping.py
          # Android source-only checks are outside Windows-only staging; retain them for Android QA.
          PYTHONPATH=tests local-engine/.venv/Scripts/python.exe -m pytest -p account_bound_ci -q tests/test_business_reset.py tests/test_business_restore.py tests/test_crypto_key_safety.py tests/test_lan_sync*.py tests/test_public_simple_consent.py tests/test_mobile_release_readiness.py tests/test_mobile_device_list_hide.py --deselect=tests/test_mobile_release_readiness.py::test_android_release_security_defaults_are_present --deselect=tests/test_mobile_release_readiness.py::test_android_continuity_ui_exposes_recovery_confirmation_and_binding_state
          npm test
          for Input in tests/test_api_secret_path.py tests/workspace-edge.test.mjs tests/maintenance-edge.test.mjs supabase/functions/moadoom-workspace/index.ts supabase/functions/moadoom-maintenance/index.ts supabase/functions/_shared/license.ts supabase/functions/_shared/workspace.ts supabase/functions/_shared/maintenance.ts; do
            if [ ! -f "$Input" ]; then
              printf "CI_REQUIRED_INPUT_MISSING:%s\n" "$Input" >&2
              exit 2
            fi
          done
          local-engine/.venv/Scripts/python.exe -m pytest --noconftest -q tests/test_api_secret_path.py
          node --test --experimental-strip-types tests/windows-backend-ci.test.mjs tests/windows-upgrade-ci.test.mjs tests/workspace-edge.test.mjs tests/maintenance-edge.test.mjs tests/integrated-build-config.test.mjs
          local-engine/.venv/Scripts/python.exe -m pytest -q tests/test_windows_signer_custody.py tests/test_windows_backend_deploy.py
          cd desktop
          node --test --experimental-strip-types tests/*.test.ts tests/*.test.mjs
          npm run build
          cd src-tauri
          TAURI_CONFIG="$(cat tauri.onedir.conf.json)" cargo check
          TAURI_CONFIG="$(cat tauri.onedir.conf.json)" cargo test --lib

      - name: Upload sanitized regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/release-engine/run-*/public-evidence/*.txt
            ${{ runner.temp }}/release-engine/run-*/public-evidence/*.json
            ${{ runner.temp }}/release-control/run-*/public-evidence/*.txt
            ${{ runner.temp }}/release-control/run-*/public-evidence/*.json

      - name: Validate scoped firewall offline mocks (not OS connectivity)
        shell: pwsh
        run: '& desktop/src-tauri/src/mobile_firewall.tests.ps1'

      - name: Build Windows signed bundles from onedir candidate
        run: |
          cd desktop
          npm run tauri -- build --ci -v --config src-tauri/tauri.onedir.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse | Select-Object FullName, Length

      - name: Upload private validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-v${{ steps.version.outputs.VERSION }}-candidate
          path: |
            desktop/src-tauri/target/release/bundle/msi/*
            desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Create new draft GitHub Release only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python scripts/create_release_only.py --version "$RELEASE_VERSION"
