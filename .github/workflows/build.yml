name: Build desktop app

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 순수 로직 테스트 (node --test)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: local-engine 의존성 설치
        run: |
          python -m venv local-engine/.venv
          local-engine/.venv/bin/pip install --upgrade pip
          local-engine/.venv/bin/pip install -r local-engine/requirements.txt -r tests/requirements.txt
      - name: 엔진 테스트 (pytest)
        run: local-engine/.venv/bin/pytest -q tests

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build sidecars (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-sidecars.sh
      - name: Build sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-sidecars.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'

  # 코드 저장소는 private 이라 배포 앱이 릴리스 자산을 못 받는다.
  # 빌드된 산출물만 public 저장소(insurance-ai-releases)로 미러 → updater 엔드포인트가 그쪽을 가리킨다.
  mirror-to-public:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: private 릴리스 자산 내려받기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          gh release download "app-v${{ steps.v.outputs.version }}" \
            --repo "${{ github.repository }}" --dir out
      - name: latest.json 자산 URL 을 public 저장소로 치환
        run: |
          # tauri-action 이 생성한 latest.json 은 빌드 저장소(private)를 가리킨다.
          # 배포 앱은 인증이 없으므로 public 저장소 경로로 바꿔야 다운로드가 된다.
          sed -i 's#/${{ github.repository }}/releases/download/#/nasawon0-beep/insurance-ai-releases/releases/download/#g' out/latest.json
          cat out/latest.json
      - name: public 릴리스 저장소로 미러
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="app-v${{ steps.v.outputs.version }}"
          repo="nasawon0-beep/insurance-ai-releases"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --repo "$repo" --clobber
          else
            gh release create "$tag" out/* --repo "$repo" \
              --title "App v${{ steps.v.outputs.version }}" --notes ""
          fi
